name: Reproducibility checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_replay:
        description: Run the full scientific replay and post hoc diagnostics
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHONHASHSEED: "0"

jobs:
  tests:
    if: github.event_name != 'workflow_dispatch' || !inputs.full_replay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock
      - name: Verify repository integrity
        run: python scripts/verify_repository.py
      - name: Run the 97 portable tests
        env:
          PYTHONPATH: study
        run: python -m pytest -q study/tests --ignore=study/tests/test_arkansas_extraction.py

  full-replay:
    if: github.event_name == 'workflow_dispatch' && inputs.full_replay
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock
      - name: Verify repository integrity
        run: python scripts/verify_repository.py
      - name: Run tests, scientific replay and diagnostics
        run: REVIEWER_PYTHON="$(which python)" bash run_reviewer.sh
